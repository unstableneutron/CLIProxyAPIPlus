name: Reject Unsafe Release Recovery

# Accepted upstream releases are immutable provenance roots. Rebuilding assets
# or manufacturing a replacement receipt in a different workflow would create
# evidence that upstream-sync and release webhook verification must reject.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing accepted fork tag (diagnostic only)
        required: true
        type: string
      expected_commit:
        description: Expected peeled tag commit (diagnostic only)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reject:
    runs-on: ubuntu-24.04
    steps:
      - name: Reject mutation of immutable release provenance
        run: |
          echo "Accepted-release recovery is disabled: immutable tags, release assets, receipts, Actions artifacts, and GHCR identities must not be regenerated or overwritten." >&2
          echo "Use a separately reviewed guarded policy to publish a new immutable identity instead." >&2
          exit 1
