name: docker-image

# Reusable checked publisher for one already-created fork tag. The caller owns
# promotion and tag creation; this workflow only builds that exact commit.

on:
  workflow_call:
    inputs:
      tag:
        description: Existing fork tag to publish
        required: true
        type: string
      expected_commit:
        description: Commit the tag and image must represent
        required: true
        type: string
      publish_latest:
        description: Also move the latest image tag to this manifest
        required: false
        default: false
        type: boolean
      mode:
        description: Build platform images, publish the canonical manifest, or do both
        required: false
        default: full
        type: string
    outputs:
      image:
        description: Published GHCR image name
        value: ${{ jobs.publish.outputs.image }}
      image_digest:
        description: Published multi-platform manifest digest
        value: ${{ jobs.publish.outputs.image_digest }}
      platforms_json:
        description: JSON array of required published platforms
        value: ${{ jobs.publish.outputs.platforms_json }}
  workflow_dispatch:
    inputs:
      tag:
        description: Existing fork tag to publish
        required: true
        type: string
      expected_commit:
        description: Expected peeled tag commit; empty resolves from the tag
        required: false
        default: ''
        type: string
      publish_latest:
        description: Also move latest; true preserves legacy direct dispatch behavior
        required: false
        default: true
        type: boolean
      mode:
        description: Build platform images, publish the canonical manifest, or do both
        required: true
        default: full
        type: choice
        options: [full, build, publish]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository_owner }}/cli-proxy-api-plus

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      platforms_json: ${{ steps.targets.outputs.platforms_json }}
      target_matrix: ${{ steps.targets.outputs.target_matrix }}
    steps:
      - name: Validate publication mode
        id: targets
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "${MODE}" in
            full|build|publish) ;;
            *)
              echo "Unsupported Docker publication mode: ${MODE}" >&2
              exit 1
              ;;
          esac
          TARGET_MATRIX='{"include":[{"tag_suffix":"amd64","runner":"ubuntu-24.04","platform":"linux/amd64"},{"tag_suffix":"arm64","runner":"ubuntu-24.04-arm","platform":"linux/arm64"}]}'
          if ! jq -e '
            (.include | length > 0) and
            all(.include[];
              (.tag_suffix | type == "string" and test("^[a-z0-9]+(?:-[a-z0-9]+)*$")) and
              (.runner | type == "string" and length > 0) and
              (.platform | type == "string" and test("^linux/[a-z0-9]+(?:/[a-z0-9.]+)?$")) and
              (.tag_suffix == (.platform | sub("^linux/"; "") | gsub("/"; "-")))
            ) and
            ([.include[].tag_suffix] | length == (unique | length)) and
            ([.include[].platform] | length == (unique | length))
          ' <<< "${TARGET_MATRIX}" >/dev/null; then
            echo "Docker target matrix contains duplicate or invalid entries." >&2
            exit 1
          fi
          {
            echo "target_matrix=${TARGET_MATRIX}"
            echo "platforms_json=$(jq -c '[.include[].platform]' <<< "${TARGET_MATRIX}")"
          } >> "${GITHUB_OUTPUT}"

  build:
    needs: validate
    if: inputs.mode == 'full' || inputs.mode == 'build'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.target_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Resolve and verify image identity
        id: identity
        env:
          EXPECTED_COMMIT_INPUT: ${{ inputs.expected_commit }}
          TAG: ${{ inputs.tag }}
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{}")"
          EXPECTED_COMMIT="${EXPECTED_COMMIT_INPUT}"
          if [ -z "${EXPECTED_COMMIT}" ]; then
            EXPECTED_COMMIT="${TAG_COMMIT}"
          fi
          if [ "$(git rev-parse HEAD)" != "${EXPECTED_COMMIT}" ]; then
            echo "Checkout does not match expected commit ${EXPECTED_COMMIT}." >&2
            exit 1
          fi
          if [ "${TAG_COMMIT}" != "${EXPECTED_COMMIT}" ]; then
            echo "Tag ${TAG} resolves to ${TAG_COMMIT}, expected ${EXPECTED_COMMIT}." >&2
            exit 1
          fi
          {
            echo "expected_commit=${EXPECTED_COMMIT}"
            echo "short_commit=$(git rev-parse --short=12 HEAD)"
            echo "build_date=$(git show -s --format=%cI HEAD)"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve image name
        id: image
        run: |
          IMAGE="${GHCR_REGISTRY}/${GHCR_IMAGE_NAME}"
          echo "ref=${IMAGE,,}" >> "${GITHUB_OUTPUT}"

      # docker/setup-buildx-action v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      # docker/login-action v4.4.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform by digest
        id: push
        # docker/build-push-action v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ inputs.tag }}
            COMMIT=${{ steps.identity.outputs.short_commit }}
            BUILD_DATE=${{ steps.identity.outputs.build_date }}
          outputs: type=image,name=${{ steps.image.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=cliproxy-${{ matrix.tag_suffix }}
          cache-to: type=gha,mode=max,scope=cliproxy-${{ matrix.tag_suffix }}

      - name: Export platform digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.ref }}
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ inputs.tag }}
          TAG_SUFFIX: ${{ matrix.tag_suffix }}
        run: |
          SOURCE_MANIFEST="$(docker buildx imagetools inspect \
            "${IMAGE}@${DIGEST}" \
            --format '{{json .Manifest}}')"
          ARCHITECTURE_DIGEST="${DIGEST}"
          if jq -e '.manifests | type == "array"' <<< "${SOURCE_MANIFEST}" >/dev/null 2>&1; then
            PLATFORM_OS="${PLATFORM%%/*}"
            PLATFORM_REMAINDER="${PLATFORM#*/}"
            PLATFORM_ARCH="${PLATFORM_REMAINDER%%/*}"
            PLATFORM_VARIANT=""
            if [[ "${PLATFORM_REMAINDER}" == */* ]]; then
              PLATFORM_VARIANT="${PLATFORM_REMAINDER#*/}"
            fi
            mapfile -t PLATFORM_DIGESTS < <(jq -r \
              --arg os "${PLATFORM_OS}" \
              --arg arch "${PLATFORM_ARCH}" \
              --arg variant "${PLATFORM_VARIANT}" '
                .manifests[] |
                select(
                  .platform.os == $os and
                  .platform.architecture == $arch and
                  (.platform.variant // "") == $variant
                ) |
                .digest
              ' <<< "${SOURCE_MANIFEST}")
            if [ "${#PLATFORM_DIGESTS[@]}" -ne 1 ]; then
              echo "Expected one ${PLATFORM} manifest in ${DIGEST}, found ${#PLATFORM_DIGESTS[@]}." >&2
              exit 1
            fi
            ARCHITECTURE_DIGEST="${PLATFORM_DIGESTS[0]}"
          fi
          if ! [[ "${ARCHITECTURE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid ${PLATFORM} architecture digest: ${ARCHITECTURE_DIGEST}." >&2
            exit 1
          fi
          ARCH_TAG="${TAG}-${TAG_SUFFIX}"
          EXISTING_DIGEST=""
          EXISTING_INSPECT_FILE=$(mktemp)
          trap 'rm -f "${EXISTING_INSPECT_FILE}"' EXIT
          inspect_image_state() {
            local reference=$1 present_output=$2 output output_lines
            output=$(mktemp)
            if docker buildx imagetools inspect "${reference}" > "${output}" 2>&1; then
              cp "${output}" "${present_output}"
              rm -f "${output}"
              echo present
              return 0
            fi
            output_lines=$(awk 'END { print NR }' "${output}")
            if [ "${output_lines}" -eq 1 ] && grep -Eiq \
              '^ERROR: .*(: 404 Not Found|: not found|: manifest unknown(: manifest unknown)?|: no such manifest)$' \
              "${output}"; then
              rm -f "${output}"
              echo absent
              return 0
            fi
            echo "Could not determine whether image identity ${reference} exists:" >&2
            cat "${output}" >&2
            rm -f "${output}"
            return 1
          }
          IMAGE_STATE="$(inspect_image_state \
            "${IMAGE}:${ARCH_TAG}" "${EXISTING_INSPECT_FILE}")"
          if [ "${IMAGE_STATE}" = present ]; then
            EXISTING_INSPECT="$(cat "${EXISTING_INSPECT_FILE}")"
            EXISTING_DIGEST="$(awk '$1 == "Digest:" { print $2; exit }' <<< "${EXISTING_INSPECT}")"
            if ! [[ "${EXISTING_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Could not resolve existing architecture tag ${IMAGE}:${ARCH_TAG} to one digest." >&2
              exit 1
            fi
          fi
          if [ -n "${EXISTING_DIGEST}" ] && [ "${EXISTING_DIGEST}" != "${ARCHITECTURE_DIGEST}" ]; then
            echo "Architecture tag ${IMAGE}:${ARCH_TAG} already resolves to ${EXISTING_DIGEST}, expected ${ARCHITECTURE_DIGEST}." >&2
            exit 1
          fi
          if [ -z "${EXISTING_DIGEST}" ]; then
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "${IMAGE}:${ARCH_TAG}" \
              "${IMAGE}@${ARCHITECTURE_DIGEST}"
          fi
          ARCH_INSPECT="$(docker buildx imagetools inspect "${IMAGE}:${ARCH_TAG}")"
          ARCH_DIGEST="$(awk '$1 == "Digest:" { print $2; exit }' <<< "${ARCH_INSPECT}")"
          if [ "${ARCH_DIGEST}" != "${ARCHITECTURE_DIGEST}" ]; then
            echo "Architecture tag ${IMAGE}:${ARCH_TAG} resolves to ${ARCH_DIGEST}, expected ${ARCHITECTURE_DIGEST}." >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${TAG_SUFFIX}-${DIGEST#sha256:}-${ARCHITECTURE_DIGEST#sha256:}"
          echo "Published early architecture image ${IMAGE}:${ARCH_TAG}@${ARCHITECTURE_DIGEST}."

      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docker-digests-${{ inputs.tag }}-${{ matrix.tag_suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [validate, build]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      inputs.mode != 'build' &&
      (inputs.mode == 'publish' || needs.build.result == 'success')
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.publish.outputs.image }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
      platforms_json: ${{ steps.publish.outputs.platforms_json }}
    steps:
      # docker/setup-buildx-action v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      # docker/login-action v4.4.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: docker-digests-${{ inputs.tag }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Publish and verify multi-platform manifest
        id: publish
        env:
          PLATFORMS_JSON: ${{ needs.validate.outputs.platforms_json }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
          TAG: ${{ inputs.tag }}
          TARGET_MATRIX: ${{ needs.validate.outputs.target_matrix }}
        run: |
          IMAGE="${GHCR_REGISTRY}/${GHCR_IMAGE_NAME}"
          IMAGE="${IMAGE,,}"
          TAG_ARGS=(-t "${IMAGE}:${TAG}")
          if [ "${PUBLISH_LATEST}" = true ]; then
            TAG_ARGS+=(-t "${IMAGE}:latest")
          fi
          SOURCES=()
          PLATFORMS=()
          EXPECTED_ARCHITECTURE_DIGESTS=()
          while IFS=$'\t' read -r TAG_SUFFIX PLATFORM; do
            mapfile -t DIGEST_FILES < <(find "${RUNNER_TEMP}/digests" -type f -name "${TAG_SUFFIX}-*" -print | sort)
            if [ "${#DIGEST_FILES[@]}" -ne 1 ]; then
              echo "Expected one ${PLATFORM} platform digest, found ${#DIGEST_FILES[@]}." >&2
              exit 1
            fi
            DIGEST_PAYLOAD="${DIGEST_FILES[0]##*${TAG_SUFFIX}-}"
            SOURCE_DIGEST="sha256:${DIGEST_PAYLOAD%%-*}"
            ARCHITECTURE_DIGEST="sha256:${DIGEST_PAYLOAD#*-}"
            if ! [[ "${SOURCE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || \
               ! [[ "${ARCHITECTURE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid ${PLATFORM} source or architecture digest marker." >&2
              exit 1
            fi
            ARCH_INSPECT="$(docker buildx imagetools inspect "${IMAGE}:${TAG}-${TAG_SUFFIX}")"
            ARCH_DIGEST="$(awk '$1 == "Digest:" { print $2; exit }' <<< "${ARCH_INSPECT}")"
            if [ "${ARCH_DIGEST}" != "${ARCHITECTURE_DIGEST}" ]; then
              echo "Architecture tag ${IMAGE}:${TAG}-${TAG_SUFFIX} resolves to ${ARCH_DIGEST}, expected ${ARCHITECTURE_DIGEST}." >&2
              exit 1
            fi
            SOURCES+=("${IMAGE}@${SOURCE_DIGEST}")
            PLATFORMS+=("${PLATFORM}")
            EXPECTED_ARCHITECTURE_DIGESTS+=("${ARCHITECTURE_DIGEST}")
          done < <(jq -r '.include[] | [.tag_suffix, .platform] | @tsv' <<< "${TARGET_MATRIX}")
          if [ "${#SOURCES[@]}" -ne "$(jq '.include | length' <<< "${TARGET_MATRIX}")" ]; then
            echo "Docker source count does not match the declared target matrix." >&2
            exit 1
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"
          IMAGE_INDEX="$(docker buildx imagetools inspect \
            "${IMAGE}:${TAG}" \
            --format '{{json .Manifest}}')"
          IMAGE_DIGEST="$(jq -r '.digest // empty' <<< "${IMAGE_INDEX}")"
          if [ -z "${IMAGE_DIGEST}" ]; then
            echo "Could not resolve published manifest digest." >&2
            exit 1
          fi
          for INDEX in "${!PLATFORMS[@]}"; do
            PLATFORM="${PLATFORMS[INDEX]}"
            EXPECTED_ARCHITECTURE_DIGEST="${EXPECTED_ARCHITECTURE_DIGESTS[INDEX]}"
            PLATFORM_OS="${PLATFORM%%/*}"
            PLATFORM_REMAINDER="${PLATFORM#*/}"
            PLATFORM_ARCH="${PLATFORM_REMAINDER%%/*}"
            PLATFORM_VARIANT=""
            if [[ "${PLATFORM_REMAINDER}" == */* ]]; then
              PLATFORM_VARIANT="${PLATFORM_REMAINDER#*/}"
            fi
            mapfile -t PUBLISHED_PLATFORM_DIGESTS < <(jq -r \
              --arg os "${PLATFORM_OS}" \
              --arg arch "${PLATFORM_ARCH}" \
              --arg variant "${PLATFORM_VARIANT}" '
                .manifests[]? |
                select(
                  .platform.os == $os and
                  .platform.architecture == $arch and
                  (.platform.variant // "") == $variant
                ) |
                .digest
              ' <<< "${IMAGE_INDEX}")
            if [ "${#PUBLISHED_PLATFORM_DIGESTS[@]}" -ne 1 ] || \
               [ "${PUBLISHED_PLATFORM_DIGESTS[0]:-}" != "${EXPECTED_ARCHITECTURE_DIGEST}" ]; then
              echo "Published manifest ${PLATFORM} digest does not match ${EXPECTED_ARCHITECTURE_DIGEST}." >&2
              exit 1
            fi
          done
          if [ "${PUBLISH_LATEST}" = true ]; then
            LATEST_INSPECT="$(docker buildx imagetools inspect "${IMAGE}:latest")"
            LATEST_DIGEST="$(awk '$1 == "Digest:" { print $2; exit }' <<< "${LATEST_INSPECT}")"
            if [ "${LATEST_DIGEST}" != "${IMAGE_DIGEST}" ]; then
              echo "latest digest ${LATEST_DIGEST} does not match ${TAG} digest ${IMAGE_DIGEST}." >&2
              exit 1
            fi
          fi
          {
            echo "image=${IMAGE}"
            echo "image_digest=${IMAGE_DIGEST}"
            echo "platforms_json=${PLATFORMS_JSON}"
          } >> "${GITHUB_OUTPUT}"
