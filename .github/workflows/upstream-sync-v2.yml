name: Upstream Sync v2
run-name: Upstream Sync v2 [event=${{ github.event_name }} mode=${{ inputs.mode }} force_candidate=${{ inputs.force_candidate }} repair_ref=${{ inputs.repair_ref }} repair_sha=${{ inputs.repair_sha }} repair_fingerprint=${{ inputs.repair_fingerprint }} repair_pr=${{ inputs.repair_pr }}]

# Candidate-first upstream synchronization. One exact plan is materialized,
# recorded, validated, and either retained for review or promoted unchanged.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only or promote a passing candidate
        required: true
        default: shadow
        type: choice
        options: [shadow, promote]
      force_candidate:
        description: Shadow-only candidate build when selected refs are represented
        required: false
        default: false
        type: boolean
      repair_ref:
        description: Remote repair branch to import as the exact candidate
        required: false
        default: ''
        type: string
      repair_sha:
        description: Immutable repair commit expected at repair_ref
        required: false
        default: ''
        type: string
      repair_fingerprint:
        description: Plan fingerprint represented by the repair candidate
        required: false
        default: ''
        type: string
      repair_pr:
        description: Open repair PR whose head is repair_sha
        required: false
        default: ''
        type: string

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: upstream-sync-v2
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ORIGINAL_REMOTE: original-upstream
  ORIGINAL_REPOSITORY: router-for-me/CLIProxyAPI
  PLUS_REMOTE: plus-upstream
  PLUS_REPOSITORY: kaitranntt/CLIProxyAPIPlus
  SYNC_WORK_DIR: /tmp/upstream-sync-v2-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  candidate:
    if: >-
      github.repository == 'unstableneutron/CLIProxyAPIPlus' &&
      (github.event_name == 'schedule' || github.actor == 'unstableneutron')
    runs-on: ubuntu-24.04
    outputs:
      acceptable: ${{ steps.result.outputs.acceptable }}
      base_fork_commit: ${{ steps.plan.outputs.base_fork_commit }}
      candidate_branch: ${{ steps.plan.outputs.candidate_branch }}
      candidate_sha: ${{ steps.result.outputs.candidate_sha }}
      expected_fork_tag: ${{ steps.plan.outputs.expected_fork_tag }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
      plan_fingerprint: ${{ steps.plan.outputs.plan_fingerprint }}
      sync_id: ${{ steps.plan.outputs.safe_sync_id }}
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: main

      - name: Reject forced promotion
        if: inputs.mode == 'promote' && inputs.force_candidate
        run: |
          echo "force_candidate is only valid for shadow runs." >&2
          exit 1

      - name: Configure candidate repository
        run: |
          git config user.name "cliproxy-upstream-sync[bot]"
          git config user.email "cliproxy-upstream-sync@users.noreply.github.com"
          git config merge.ours.driver true
          git remote add "${ORIGINAL_REMOTE}" "https://github.com/${ORIGINAL_REPOSITORY}.git"
          git remote add "${PLUS_REMOTE}" "https://github.com/${PLUS_REPOSITORY}.git"
          mkdir -p "${SYNC_WORK_DIR}/report"

      - name: Snapshot exact target refs
        id: plan
        env:
          FORCE_CANDIDATE: ${{ inputs.force_candidate }}
        run: |
          PLAN_FILE="${SYNC_WORK_DIR}/plan.out"
          STEP_OUTPUT="${GITHUB_OUTPUT}"
          FORCE_REBUILD="${FORCE_CANDIDATE}" GITHUB_OUTPUT="${PLAN_FILE}" \
            .github/scripts/upstream-sync.sh plan
          cat "${PLAN_FILE}" >> "${STEP_OUTPUT}"

      - name: Validate repair import request
        id: repair_request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_CHANGES: ${{ steps.plan.outputs.has_changes }}
          PLAN_FINGERPRINT: ${{ steps.plan.outputs.plan_fingerprint }}
          REPAIR_FINGERPRINT: ${{ inputs.repair_fingerprint }}
          REPAIR_PR: ${{ inputs.repair_pr }}
          REPAIR_REF_INPUT: ${{ inputs.repair_ref }}
          REPAIR_SHA: ${{ inputs.repair_sha }}
        run: |
          if [ -z "${REPAIR_REF_INPUT}" ] && \
             [ -z "${REPAIR_SHA}" ] && \
             [ -z "${REPAIR_FINGERPRINT}" ] && \
             [ -z "${REPAIR_PR}" ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${HAS_CHANGES}" != true ]; then
            echo "A repair candidate cannot be imported when the exact target is already represented." >&2
            exit 1
          fi
          if [ -z "${REPAIR_REF_INPUT}" ] || \
             [ -z "${REPAIR_SHA}" ] || \
             [ -z "${REPAIR_FINGERPRINT}" ] || \
             [ -z "${REPAIR_PR}" ]; then
            echo "repair_ref, repair_sha, repair_fingerprint, and repair_pr must be supplied together." >&2
            exit 1
          fi
          if ! [[ "${REPAIR_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "repair_sha must be a 40-character lowercase commit." >&2
            exit 1
          fi
          if ! [[ "${REPAIR_FINGERPRINT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "repair_fingerprint must be a 40-character lowercase hash." >&2
            exit 1
          fi
          if ! [[ "${REPAIR_PR}" =~ ^[0-9]+$ ]]; then
            echo "repair_pr must be a pull request number." >&2
            exit 1
          fi
          if [ "${REPAIR_FINGERPRINT}" != "${PLAN_FINGERPRINT}" ]; then
            echo "Repair fingerprint ${REPAIR_FINGERPRINT} does not match live plan ${PLAN_FINGERPRINT}." >&2
            exit 1
          fi
          REPAIR_REF=${REPAIR_REF_INPUT#refs/heads/}
          PR_JSON="$(gh pr view "${REPAIR_PR}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json baseRefName,headRefName,headRefOid,isDraft,mergeable,reviewDecision,state,statusCheckRollup)"
          if ! jq -e \
            --arg ref "${REPAIR_REF}" \
            --arg sha "${REPAIR_SHA}" '
              .state == "OPEN" and
              .isDraft == false and
              .baseRefName == "main" and
              .headRefName == $ref and
              .headRefOid == $sha and
              .mergeable == "MERGEABLE" and
              (.reviewDecision // "") != "CHANGES_REQUESTED" and
              ((.statusCheckRollup // []) | length) > 0 and
              all((.statusCheckRollup // [])[];
                ((.conclusion // .state // "") | ascii_upcase) as $status |
                ($status == "SUCCESS" or $status == "NEUTRAL" or $status == "SKIPPED")
              )
            ' <<< "${PR_JSON}" >/dev/null; then
            echo "Repair PR ${REPAIR_PR} is not an exact, mergeable, review-clean, fully checked match for ${REPAIR_SHA}." >&2
            exit 1
          fi
          {
            echo "enabled=true"
            echo "repair_ref=${REPAIR_REF}"
          } >> "${GITHUB_OUTPUT}"

      - name: Report represented target
        if: steps.plan.outputs.has_changes == 'false'
        env:
          EXPECTED_FORK_TAG: ${{ steps.plan.outputs.expected_fork_tag }}
          PLAN_FINGERPRINT: ${{ steps.plan.outputs.plan_fingerprint }}
        run: |
          {
            echo "## Upstream sync v2"
            echo
            echo "The exact target is already represented by \`${EXPECTED_FORK_TAG}\`."
            echo "Plan fingerprint: \`${PLAN_FINGERPRINT}\`."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify represented release receipt
        if: steps.plan.outputs.has_changes == 'false'
        env:
          EXPECTED_FORK_TAG: ${{ steps.plan.outputs.expected_fork_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event_name == 'schedule' && 'promote' || inputs.mode }}
          PLAN_MODELS_COMMIT: ${{ steps.plan.outputs.models_commit }}
          PLAN_ORIGINAL_COMMIT: ${{ steps.plan.outputs.original_head }}
          PLAN_PLUS_HEAD_COMMIT: ${{ steps.plan.outputs.plus_head }}
          PLAN_PLUS_HEAD_INCLUDED: ${{ steps.plan.outputs.plus_head_included }}
          PLAN_PLUS_TAG_COMMIT: ${{ steps.plan.outputs.plus_tag_head }}
        run: |
          RECEIPT_DIR="${SYNC_WORK_DIR}/represented-release"
          mkdir -p "${RECEIPT_DIR}"
          git fetch --force origin "refs/tags/${EXPECTED_FORK_TAG}:refs/tags/${EXPECTED_FORK_TAG}"
          TAG_COMMIT="$(git rev-parse "refs/tags/${EXPECTED_FORK_TAG}^{}")"
          STATE_FILE="${RECEIPT_DIR}/expected-state.env"
          set +e
          git show "refs/tags/${EXPECTED_FORK_TAG}:.ccs-fork-upstream.env" > "${STATE_FILE}"
          STATE_EXIT=$?
          RECEIPT_KIND=upstream-sync
          gh release download "${EXPECTED_FORK_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern upstream-sync-receipt.json \
            --dir "${RECEIPT_DIR}"
          DOWNLOAD_EXIT=$?
          if [ "${DOWNLOAD_EXIT}" -ne 0 ]; then
            RECEIPT_KIND=hotfix
            gh release download "${EXPECTED_FORK_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern hotfix-release-receipt.json \
              --dir "${RECEIPT_DIR}"
            DOWNLOAD_EXIT=$?
          fi
          set -e

          state_value() {
            local key=$1
            awk -F= -v key="${key}" \
              '$1 == key { sub(/^[^=]*=/, ""); print; exit }' \
              "${STATE_FILE}"
          }
          STATE_SYNC_ID="$(state_value SYNC_ID)"
          STATE_FINGERPRINT="$(state_value PLAN_FINGERPRINT)"
          STATE_ORIGINAL_COMMIT="$(state_value ORIGINAL_COMMIT)"
          STATE_PLUS_TAG_COMMIT="$(state_value PLUS_TAG_COMMIT)"
          STATE_PLUS_HEAD_COMMIT="$(state_value PLUS_HEAD_COMMIT)"
          STATE_PLUS_HEAD_INCLUDED="$(state_value PLUS_HEAD_INCLUDED)"
          STATE_MODELS_COMMIT="$(state_value MODELS_COMMIT)"
          if [ "${STATE_EXIT}" -ne 0 ] || \
             [ -z "${STATE_SYNC_ID}" ] || \
             [ -z "${STATE_FINGERPRINT}" ] || \
             [ -z "${STATE_ORIGINAL_COMMIT}" ] || \
             [ -z "${STATE_PLUS_TAG_COMMIT}" ] || \
             [ -z "${STATE_PLUS_HEAD_COMMIT}" ] || \
             [ -z "${STATE_PLUS_HEAD_INCLUDED}" ] || \
             [ -z "${STATE_MODELS_COMMIT}" ] || \
             [ "${DOWNLOAD_EXIT}" -ne 0 ]; then
            if [ "${MODE}" = shadow ]; then
              echo "Legacy release without a v2 receipt; shadow verification made no changes." >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            echo "Represented release lacks v2 state or a supported release receipt." >&2
            exit 1
          fi
          if [ "${STATE_ORIGINAL_COMMIT}" != "${PLAN_ORIGINAL_COMMIT}" ] || \
             [ "${STATE_PLUS_TAG_COMMIT}" != "${PLAN_PLUS_TAG_COMMIT}" ] || \
             [ "${STATE_PLUS_HEAD_COMMIT}" != "${PLAN_PLUS_HEAD_COMMIT}" ] || \
             [ "${STATE_PLUS_HEAD_INCLUDED}" != "${PLAN_PLUS_HEAD_INCLUDED}" ] || \
             [ "${STATE_MODELS_COMMIT}" != "${PLAN_MODELS_COMMIT}" ]; then
            echo "Represented release state does not match the selected exact refs." >&2
            exit 1
          fi
          if [ "${RECEIPT_KIND}" = hotfix ]; then
            HOTFIX_RECEIPT="${RECEIPT_DIR}/hotfix-release-receipt.json"
            BASE_TAG="$(jq -r '.previous_release.tag // empty' "${HOTFIX_RECEIPT}")"
            BASE_COMMIT="$(jq -r '.previous_release.commit // empty' "${HOTFIX_RECEIPT}")"
            RECEIPT_WORKFLOW_REF="$(jq -r '.release_workflow.ref // empty' "${HOTFIX_RECEIPT}")"
            RECEIPT_RUN_ID="$(jq -r '.release_workflow.run_id // empty' "${HOTFIX_RECEIPT}")"
            RECEIPT_RUN_ATTEMPT="$(jq -r '.release_workflow.run_attempt // empty' "${HOTFIX_RECEIPT}")"
            if [ -z "${BASE_TAG}" ] || \
               ! [[ "${BASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || \
               [ -z "${RECEIPT_WORKFLOW_REF}" ] || \
               [ -z "${RECEIPT_RUN_ID}" ] || \
               [ -z "${RECEIPT_RUN_ATTEMPT}" ]; then
              echo "Hotfix receipt has incomplete base or workflow provenance." >&2
              exit 1
            fi
            GITHUB_WORKFLOW_REF="${RECEIPT_WORKFLOW_REF}" \
            GITHUB_RUN_ID="${RECEIPT_RUN_ID}" \
            GITHUB_RUN_ATTEMPT="${RECEIPT_RUN_ATTEMPT}" \
              .github/scripts/verify-hotfix-release.sh \
                --tag "${EXPECTED_FORK_TAG}" \
                --expected-commit "${TAG_COMMIT}" \
                --base-tag "${BASE_TAG}" \
                --expected-base-commit "${BASE_COMMIT}" \
                --expected-sync-id "${STATE_SYNC_ID}" \
                --expected-plan-fingerprint "${STATE_FINGERPRINT}" \
                --image ghcr.io/unstableneutron/cli-proxy-api-plus \
                --main-policy descendant \
                --require-latest-parity true \
                --receipt "${RECEIPT_DIR}/verified-receipt.json"
            diff -u \
              <(jq -S . "${HOTFIX_RECEIPT}") \
              <(jq -S . "${RECEIPT_DIR}/verified-receipt.json")
          else
            REQUIRE_ARCHITECTURE_TAGS=false
            if jq -e '(.schema_version // 1) >= 2' \
              "${RECEIPT_DIR}/upstream-sync-receipt.json" >/dev/null; then
              REQUIRE_ARCHITECTURE_TAGS=true
            fi
            .github/scripts/verify-upstream-release.sh \
              --tag "${EXPECTED_FORK_TAG}" \
              --expected-commit "${TAG_COMMIT}" \
              --expected-sync-id "${STATE_SYNC_ID}" \
              --expected-plan-fingerprint "${STATE_FINGERPRINT}" \
              --image ghcr.io/unstableneutron/cli-proxy-api-plus \
              --main-policy descendant \
              --require-architecture-tags "${REQUIRE_ARCHITECTURE_TAGS}" \
              --require-latest-parity true \
              --receipt "${RECEIPT_DIR}/verified-receipt.json"
            diff -u \
              <(jq -S 'del(.workflow_run_id)' "${RECEIPT_DIR}/upstream-sync-receipt.json") \
              <(jq -S 'del(.workflow_run_id)' "${RECEIPT_DIR}/verified-receipt.json")
          fi
          echo "Verified existing release receipt for ${EXPECTED_FORK_TAG}." >> "${GITHUB_STEP_SUMMARY}"

      - name: Materialize target-specific candidate
        id: materialize
        if: steps.plan.outputs.has_changes == 'true' && steps.repair_request.outputs.enabled != 'true'
        run: |
          MATERIALIZE_FILE="${SYNC_WORK_DIR}/materialize.out"
          STEP_OUTPUT="${GITHUB_OUTPUT}"
          GITHUB_OUTPUT="${MATERIALIZE_FILE}" \
            .github/scripts/upstream-sync.sh materialize "${SYNC_WORK_DIR}/plan.out"
          cat "${MATERIALIZE_FILE}" >> "${SYNC_WORK_DIR}/plan.out"
          cat "${MATERIALIZE_FILE}" >> "${STEP_OUTPUT}"

      - name: Import exact repaired candidate
        id: repair
        if: steps.plan.outputs.has_changes == 'true' && steps.repair_request.outputs.enabled == 'true'
        env:
          BASE_FORK_COMMIT: ${{ steps.plan.outputs.base_fork_commit }}
          BRANCH: ${{ steps.plan.outputs.candidate_branch }}
          REPAIR_REF: ${{ steps.repair_request.outputs.repair_ref }}
          REPAIR_SHA: ${{ inputs.repair_sha }}
        run: |
          IMPORT_REF="refs/upstream-sync-repair/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git fetch --force origin "refs/heads/${REPAIR_REF}:${IMPORT_REF}"
          ACTUAL_SHA="$(git rev-parse "${IMPORT_REF}^{commit}")"
          if [ "${ACTUAL_SHA}" != "${REPAIR_SHA}" ]; then
            echo "Repair ref ${REPAIR_REF} moved to ${ACTUAL_SHA}; expected ${REPAIR_SHA}." >&2
            exit 1
          fi
          RESTRICTED_CHANGES="$(git diff --name-only "${BASE_FORK_COMMIT}..${REPAIR_SHA}" -- \
            .github/workflows \
            .github/workflows-disabled \
            .github/scripts \
            .github/upstream-sync-ownership.tsv \
            .github/upstream-sync-invariants.tsv)"
          if [ -n "${RESTRICTED_CHANGES}" ]; then
            echo "Repair candidate changes protected sync-policy paths: ${RESTRICTED_CHANGES}" >&2
            exit 1
          fi
          git checkout -B "${BRANCH}" "${REPAIR_SHA}"
          REPAIR_OUTPUT="${SYNC_WORK_DIR}/repair.out"
          GITHUB_OUTPUT="${REPAIR_OUTPUT}" \
            .github/scripts/upstream-sync.sh validate-repair "${SYNC_WORK_DIR}/plan.out" "${REPAIR_SHA}"
          cat "${REPAIR_OUTPUT}" >> "${SYNC_WORK_DIR}/plan.out"
          cat "${REPAIR_OUTPUT}" >> "${GITHUB_OUTPUT}"

      - name: Record candidate state
        if: steps.plan.outputs.has_changes == 'true' && steps.repair_request.outputs.enabled != 'true'
        run: .github/scripts/upstream-sync.sh record-state "${SYNC_WORK_DIR}/plan.out"

      - name: Check source freshness
        id: freshness
        if: steps.plan.outputs.has_changes == 'true'
        env:
          ALLOW_FORK_BASE_DRIFT: ${{ inputs.mode == 'shadow' }}
        run: |
          FRESHNESS_FILE="${SYNC_WORK_DIR}/freshness.out"
          STEP_OUTPUT="${GITHUB_OUTPUT}"
          set +e
          UPSTREAM_SYNC_ALLOW_FORK_BASE_DRIFT="${ALLOW_FORK_BASE_DRIFT}" \
            GITHUB_OUTPUT="${FRESHNESS_FILE}" \
            .github/scripts/upstream-sync.sh check-freshness "${SYNC_WORK_DIR}/plan.out"
          FRESHNESS_EXIT=$?
          set -e
          cat "${FRESHNESS_FILE}" >> "${SYNC_WORK_DIR}/plan.out"
          cat "${FRESHNESS_FILE}" >> "${STEP_OUTPUT}"
          echo "exit_code=${FRESHNESS_EXIT}" >> "${STEP_OUTPUT}"

      - name: Report path provenance
        id: provenance
        if: steps.plan.outputs.has_changes == 'true'
        run: |
          PROVENANCE_OUTPUT="${SYNC_WORK_DIR}/provenance.out"
          STEP_OUTPUT="${GITHUB_OUTPUT}"
          UPSTREAM_SYNC_REPORT_DIR="${SYNC_WORK_DIR}/report" \
            GITHUB_OUTPUT="${PROVENANCE_OUTPUT}" \
            .github/scripts/upstream-sync.sh report-provenance "${SYNC_WORK_DIR}/plan.out" HEAD
          cat "${PROVENANCE_OUTPUT}" >> "${STEP_OUTPUT}"

      # actions/setup-go v6.5.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: steps.plan.outputs.has_changes == 'true'
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run the single full validation pass
        id: validation
        if: steps.plan.outputs.has_changes == 'true'
        continue-on-error: true
        env:
          UPSTREAM_SYNC_TOOLING_MODE: always
        run: .github/scripts/validate-upstream-sync.sh --mode full --plan "${SYNC_WORK_DIR}/plan.out" --report-dir "${SYNC_WORK_DIR}/report"

      - name: Render candidate report
        if: always() && steps.plan.outputs.has_changes == 'true'
        env:
          UPSTREAM_SYNC_WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          .github/scripts/render-upstream-sync-report.sh \
            --plan "${SYNC_WORK_DIR}/plan.out" \
            --validation "${SYNC_WORK_DIR}/report/validation.env" \
            --provenance "${SYNC_WORK_DIR}/report/provenance.tsv" \
            --output "${SYNC_WORK_DIR}/report/candidate.md"

      - name: Classify candidate result
        id: result
        if: always() && steps.plan.outputs.has_changes == 'true'
        env:
          BLOCKED: ${{ steps.plan.outputs.blocked }}
          CONFLICTS: ${{ steps.materialize.outputs.conflicts || steps.repair.outputs.conflicts }}
          FRESH: ${{ steps.freshness.outputs.fresh }}
          MANUAL_COMPOSITION: ${{ steps.provenance.outputs.manual_composition_required }}
          REPAIR_VALIDATED: ${{ steps.repair.outputs.repair_validated }}
        run: |
          VALIDATION_STATUS="$(awk -F= '$1 == "OVERALL_STATUS" { print $2; exit }' "${SYNC_WORK_DIR}/report/validation.env")"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          ACCEPTABLE=false
          COMPOSITION_ACCEPTABLE=false
          if [ "${MANUAL_COMPOSITION}" != true ] || [ "${REPAIR_VALIDATED}" = true ]; then
            COMPOSITION_ACCEPTABLE=true
          fi
          if [ "${BLOCKED}" != true ] && \
             [ "${CONFLICTS}" != true ] && \
             [ "${FRESH}" = true ] && \
             [ "${COMPOSITION_ACCEPTABLE}" = true ] && \
             [ "${VALIDATION_STATUS}" = passed ]; then
            ACCEPTABLE=true
          fi
          {
            echo "acceptable=${ACCEPTABLE}"
            echo "candidate_sha=${CANDIDATE_SHA}"
            echo "validation_status=${VALIDATION_STATUS}"
          } >> "${GITHUB_OUTPUT}"
          cat "${SYNC_WORK_DIR}/report/candidate.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish candidate branch with a fingerprint lease
        if: always() && steps.plan.outputs.has_changes == 'true' && steps.result.outputs.candidate_sha != ''
        env:
          BRANCH: ${{ steps.plan.outputs.candidate_branch }}
          PLAN_FINGERPRINT: ${{ steps.plan.outputs.plan_fingerprint }}
        run: |
          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/${BRANCH}" | awk '{ print $1; exit }')"
          if [ -n "${REMOTE_SHA}" ]; then
            git fetch --quiet origin "refs/heads/${BRANCH}:refs/upstream-sync-existing/${GITHUB_RUN_ID}"
            REMOTE_FINGERPRINT="$(git show "${REMOTE_SHA}:.ccs-fork-upstream.env" | awk -F= '$1 == "PLAN_FINGERPRINT" { print $2; exit }')"
            if [ "${REMOTE_FINGERPRINT}" != "${PLAN_FINGERPRINT}" ]; then
              echo "Remote candidate ${BRANCH} has a different plan fingerprint." >&2
              exit 1
            fi
          fi
          git push \
            "--force-with-lease=refs/heads/${BRANCH}:${REMOTE_SHA}" \
            origin "HEAD:refs/heads/${BRANCH}"

      - name: Write machine-readable run ledger
        if: always() && steps.plan.outputs.has_changes == 'true'
        env:
          ACCEPTABLE: ${{ steps.result.outputs.acceptable }}
          BASE_FORK_COMMIT: ${{ steps.plan.outputs.base_fork_commit }}
          BLOCKED: ${{ steps.plan.outputs.blocked }}
          CANDIDATE_BRANCH: ${{ steps.plan.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ steps.result.outputs.candidate_sha }}
          EXPECTED_FORK_TAG: ${{ steps.plan.outputs.expected_fork_tag }}
          MODELS_COMMIT: ${{ steps.plan.outputs.models_commit }}
          ORIGINAL_COMMIT: ${{ steps.plan.outputs.original_head }}
          ORIGINAL_TAG: ${{ steps.plan.outputs.original_tag }}
          PLAN_FINGERPRINT: ${{ steps.plan.outputs.plan_fingerprint }}
          PLUS_HEAD: ${{ steps.plan.outputs.plus_head }}
          PLUS_HEAD_INCLUDED: ${{ steps.plan.outputs.plus_head_included }}
          PLUS_TAG: ${{ steps.plan.outputs.plus_tag }}
          PLUS_TAG_COMMIT: ${{ steps.plan.outputs.plus_tag_head }}
          REPAIR_ENABLED: ${{ steps.repair_request.outputs.enabled }}
          REPAIR_PR: ${{ inputs.repair_pr }}
          REPAIR_SHA: ${{ inputs.repair_sha }}
          SYNC_ID: ${{ steps.plan.outputs.safe_sync_id }}
          TARGET_DRIFT: ${{ steps.plan.outputs.target_drift }}
          VALIDATION_STATUS: ${{ steps.result.outputs.validation_status }}
        run: |
          jq -n \
            --arg base_fork_commit "${BASE_FORK_COMMIT}" \
            --arg original_tag "${ORIGINAL_TAG}" \
            --arg original_commit "${ORIGINAL_COMMIT}" \
            --arg plus_tag "${PLUS_TAG}" \
            --arg plus_tag_commit "${PLUS_TAG_COMMIT}" \
            --arg plus_head "${PLUS_HEAD}" \
            --arg plus_head_included "${PLUS_HEAD_INCLUDED}" \
            --arg models_commit "${MODELS_COMMIT}" \
            --arg sync_id "${SYNC_ID}" \
            --arg plan_fingerprint "${PLAN_FINGERPRINT}" \
            --arg candidate_branch "${CANDIDATE_BRANCH}" \
            --arg candidate_sha "${CANDIDATE_SHA}" \
            --arg expected_fork_tag "${EXPECTED_FORK_TAG}" \
            --arg target_drift "${TARGET_DRIFT}" \
            --arg blocked "${BLOCKED}" \
            --arg repair_enabled "${REPAIR_ENABLED}" \
            --arg repair_pr "${REPAIR_PR}" \
            --arg repair_sha "${REPAIR_SHA}" \
            --arg validation_status "${VALIDATION_STATUS}" \
            --arg acceptable "${ACCEPTABLE}" '
              {
                schema_version: 1,
                state: (if $acceptable == "true" then "candidate_validated" else "candidate_rejected" end),
                target: {
                  base_fork_commit: $base_fork_commit,
                  original: {tag: $original_tag, commit: $original_commit},
                  plus: {
                    tag: $plus_tag,
                    tag_commit: $plus_tag_commit,
                    head: $plus_head,
                    head_included: ($plus_head_included == "true")
                  },
                  models_commit: $models_commit,
                  sync_id: $sync_id,
                  plan_fingerprint: $plan_fingerprint,
                  expected_fork_tag: $expected_fork_tag,
                  target_drift: ($target_drift == "true"),
                  blocked: ($blocked == "true")
                },
                candidate: {
                  branch: $candidate_branch,
                  sha: $candidate_sha,
                  acceptable: ($acceptable == "true"),
                  validation_status: $validation_status
                },
                repair: {
                  imported: ($repair_enabled == "true"),
                  pr: (if $repair_pr == "" then null else ($repair_pr | tonumber) end),
                  sha: (if $repair_sha == "" then null else $repair_sha end)
                },
                final_plan: {status: "pending_external_verification"},
                runtime_smoke: "not_run",
                vn3_deployed: false
              }
            ' > "${SYNC_WORK_DIR}/run-state.json"

      # Publish immutable provenance before opening the PR so the webhook can
      # validate the artifact without racing the workflow.
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.plan.outputs.has_changes == 'true'
        with:
          name: upstream-sync-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SYNC_WORK_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Open or update blocked candidate PR
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'promote') && steps.plan.outputs.has_changes == 'true' && steps.result.outputs.acceptable != 'true'
        env:
          BRANCH: ${{ steps.plan.outputs.candidate_branch }}
          EXPECTED_FORK_TAG: ${{ steps.plan.outputs.expected_fork_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "${PR_NUMBER}" ]; then
            gh pr edit "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body-file "${SYNC_WORK_DIR}/report/candidate.md"
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${BRANCH}" \
              --title "Resolve upstream sync ${EXPECTED_FORK_TAG}" \
              --body-file "${SYNC_WORK_DIR}/report/candidate.md"
          fi

      - name: Reject unpromotable candidate
        if: always() && steps.plan.outputs.has_changes == 'true' && steps.result.outputs.acceptable != 'true'
        run: |
          echo "The candidate is blocked, stale, conflicting, manually composed, or failed validation." >&2
          exit 1

  promote:
    needs: candidate
    if: (github.event_name == 'schedule' || inputs.mode == 'promote') && needs.candidate.outputs.has_changes == 'true' && needs.candidate.outputs.acceptable == 'true'
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.candidate_branch }}

      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: upstream-sync-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SYNC_WORK_DIR }}

      - name: Configure promotion repository
        run: |
          git config user.name "cliproxy-upstream-sync[bot]"
          git config user.email "cliproxy-upstream-sync@users.noreply.github.com"
          git remote add "${ORIGINAL_REMOTE}" "https://github.com/${ORIGINAL_REPOSITORY}.git"
          git remote add "${PLUS_REMOTE}" "https://github.com/${PLUS_REPOSITORY}.git"

      - name: Verify candidate and main identities
        id: identity
        env:
          BASE_FORK_COMMIT: ${{ needs.candidate.outputs.base_fork_commit }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          PLAN_FINGERPRINT: ${{ needs.candidate.outputs.plan_fingerprint }}
        run: |
          if [ "$(git rev-parse HEAD)" != "${CANDIDATE_SHA}" ]; then
            echo "Checked-out candidate does not match validated SHA ${CANDIDATE_SHA}." >&2
            exit 1
          fi
          STATE_FINGERPRINT="$(awk -F= '$1 == "PLAN_FINGERPRINT" { print $2; exit }' .ccs-fork-upstream.env)"
          if [ "${STATE_FINGERPRINT}" != "${PLAN_FINGERPRINT}" ]; then
            echo "Candidate state fingerprint does not match the validated plan." >&2
            exit 1
          fi
          git fetch --quiet origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "${MAIN_SHA}" = "${BASE_FORK_COMMIT}" ]; then
            MAIN_STATE=base
          elif [ "${MAIN_SHA}" = "${CANDIDATE_SHA}" ]; then
            MAIN_STATE=candidate
          else
            echo "origin/main moved to ${MAIN_SHA}; expected ${BASE_FORK_COMMIT} or retry candidate ${CANDIDATE_SHA}." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${BASE_FORK_COMMIT}" "${CANDIDATE_SHA}"; then
            echo "Validated candidate is not descended from its planned fork base." >&2
            exit 1
          fi
          echo "main_state=${MAIN_STATE}" >> "${GITHUB_OUTPUT}"

      - name: Recheck exact source freshness
        env:
          ALLOW_FORK_BASE_DRIFT: ${{ steps.identity.outputs.main_state == 'candidate' }}
        run: |
          UPSTREAM_SYNC_ALLOW_FORK_BASE_DRIFT="${ALLOW_FORK_BASE_DRIFT}" \
            .github/scripts/upstream-sync.sh check-freshness "${SYNC_WORK_DIR}/plan.out"

      - name: Fast-forward accepted candidate to main
        if: steps.identity.outputs.main_state == 'base'
        run: git push origin HEAD:main

      - name: Create or verify accepted tag
        id: tag
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          TAG: ${{ needs.candidate.outputs.expected_fork_tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{}")"
            if [ "${TAG_COMMIT}" != "${CANDIDATE_SHA}" ]; then
              echo "Existing tag ${TAG} resolves to ${TAG_COMMIT}, expected ${CANDIDATE_SHA}." >&2
              exit 1
            fi
          else
            git tag -a "${TAG}" "${CANDIDATE_SHA}" -m "Release ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi
          {
            echo "commit=${CANDIDATE_SHA}"
            echo "tag=${TAG}"
          } >> "${GITHUB_OUTPUT}"

  release:
    needs: promote
    if: needs.promote.result == 'success'
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.promote.outputs.tag }}
      expected_commit: ${{ needs.promote.outputs.commit }}
    secrets: inherit

  docker_build:
    needs: promote
    if: needs.promote.result == 'success'
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: ${{ needs.promote.outputs.tag }}
      expected_commit: ${{ needs.promote.outputs.commit }}
      mode: build
    secrets: inherit

  docker:
    needs: [promote, release, docker_build]
    if: >-
      needs.promote.result == 'success' &&
      needs.release.result == 'success' &&
      needs.docker_build.result == 'success'
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: ${{ needs.promote.outputs.tag }}
      expected_commit: ${{ needs.promote.outputs.commit }}
      publish_latest: true
      mode: publish
    secrets: inherit

  verify:
    needs: [candidate, promote, release, docker_build, docker]
    if: >-
      needs.promote.result == 'success' &&
      needs.release.result == 'success' &&
      needs.docker_build.result == 'success' &&
      needs.docker.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ needs.promote.outputs.commit }}

      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: upstream-sync-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SYNC_WORK_DIR }}

      - name: Verify release, image, and promoted identity
        env:
          EXPECTED_COMMIT: ${{ needs.promote.outputs.commit }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.docker.outputs.image_digest }}
          EXPECTED_PLAN_FINGERPRINT: ${{ needs.candidate.outputs.plan_fingerprint }}
          EXPECTED_SYNC_ID: ${{ needs.candidate.outputs.sync_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.docker.outputs.image }}
          TAG: ${{ needs.promote.outputs.tag }}
        run: |
          .github/scripts/verify-upstream-release.sh \
            --tag "${TAG}" \
            --expected-commit "${EXPECTED_COMMIT}" \
            --expected-sync-id "${EXPECTED_SYNC_ID}" \
            --expected-plan-fingerprint "${EXPECTED_PLAN_FINGERPRINT}" \
            --image "${IMAGE}" \
            --require-architecture-tags true \
            --require-latest-parity true \
            --receipt upstream-sync-receipt.json
          RECEIPT_DIGEST="$(jq -r '.image_digest' upstream-sync-receipt.json)"
          if [ "${RECEIPT_DIGEST}" != "${EXPECTED_IMAGE_DIGEST}" ]; then
            echo "Verified digest ${RECEIPT_DIGEST} does not match publisher output ${EXPECTED_IMAGE_DIGEST}." >&2
            exit 1
          fi

      - name: Attach receipt to the verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.promote.outputs.tag }}
        run: |
          gh release upload "${TAG}" upstream-sync-receipt.json \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          gh release view "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets[].name' \
            | grep -Fx upstream-sync-receipt.json

      - name: Require final fetched no-op plan
        env:
          PROMOTED_COMMIT: ${{ needs.promote.outputs.commit }}
        run: |
          git remote add "${ORIGINAL_REMOTE}" "https://github.com/${ORIGINAL_REPOSITORY}.git"
          git remote add "${PLUS_REMOTE}" "https://github.com/${PLUS_REPOSITORY}.git"
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "${PROMOTED_COMMIT}" ]; then
            echo "origin/main moved after promotion." >&2
            exit 1
          fi
          FINAL_PLAN="${SYNC_WORK_DIR}/final-plan.out"
          GITHUB_OUTPUT="${FINAL_PLAN}" .github/scripts/upstream-sync.sh plan
          cat "${FINAL_PLAN}"
          FINAL_HAS_CHANGES="$(awk -F= '$1 == "has_changes" { print $2; exit }' "${FINAL_PLAN}")"
          FINAL_TARGET_DRIFT="$(awk -F= '$1 == "target_drift" { print $2; exit }' "${FINAL_PLAN}")"
          FINAL_BLOCKED="$(awk -F= '$1 == "blocked" { print $2; exit }' "${FINAL_PLAN}")"
          if [ "${FINAL_HAS_CHANGES}" != false ] || \
             [ "${FINAL_TARGET_DRIFT}" != false ] || \
             [ "${FINAL_BLOCKED}" != false ]; then
            echo "Final planner did not reach clean no-op state." >&2
            exit 1
          fi

      - name: Finalize machine-readable run ledger
        env:
          PROMOTED_COMMIT: ${{ needs.promote.outputs.commit }}
          TAG: ${{ needs.promote.outputs.tag }}
        run: |
          STATE_FILE="${SYNC_WORK_DIR}/run-state.json"
          FINAL_PLAN="${SYNC_WORK_DIR}/final-plan.out"
          FINAL_FINGERPRINT="$(awk -F= '$1 == "plan_fingerprint" { print $2; exit }' "${FINAL_PLAN}")"
          FINAL_HAS_CHANGES="$(awk -F= '$1 == "has_changes" { print $2; exit }' "${FINAL_PLAN}")"
          FINAL_TARGET_DRIFT="$(awk -F= '$1 == "target_drift" { print $2; exit }' "${FINAL_PLAN}")"
          FINAL_BLOCKED="$(awk -F= '$1 == "blocked" { print $2; exit }' "${FINAL_PLAN}")"
          jq \
            --arg promoted_commit "${PROMOTED_COMMIT}" \
            --arg tag "${TAG}" \
            --arg final_fingerprint "${FINAL_FINGERPRINT}" \
            --arg final_has_changes "${FINAL_HAS_CHANGES}" \
            --arg final_target_drift "${FINAL_TARGET_DRIFT}" \
            --arg final_blocked "${FINAL_BLOCKED}" \
            --slurpfile receipt upstream-sync-receipt.json '
              $receipt[0] as $release |
              .state = "released" |
              .promotion = {
                commit: $promoted_commit,
                tag: $tag
              } |
              .release = {
                url: $release.release_url,
                assets: $release.release_assets,
                image: $release.image,
                image_digest: $release.image_digest,
                platforms: $release.platforms,
                architecture_images: ($release.architecture_images // {})
              } |
              .final_plan = {
                status: "clean-noop",
                plan_fingerprint: $final_fingerprint,
                has_changes: ($final_has_changes == "true"),
                target_drift: ($final_target_drift == "true"),
                blocked: ($final_blocked == "true")
              }
            ' "${STATE_FILE}" > "${STATE_FILE}.tmp"
          mv "${STATE_FILE}.tmp" "${STATE_FILE}"

      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: upstream-sync-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            upstream-sync-receipt.json
            ${{ env.SYNC_WORK_DIR }}/run-state.json
          if-no-files-found: error
          retention-days: 90
